# Import local secrets file if present (ignored by git)
spring.config.import=optional:classpath:application-local.properties

spring.application.name=eshop-backend
server.port=8000

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:eshop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT & Activation Secrets
jwt.secret=${JWT_SECRET:9a4f2c8d3e71b5a6c8e0d2f4a6b8c1d3e5f7a9b0c2d4e6f8a1b3c5d7e9f1a2b3}
jwt.expiration-days=90
activation.secret=${ACTIVATION_SECRET:1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b}
activation.expiration-minutes=5

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary Storage
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Stripe Payment
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.api-key=${STRIPE_API_KEY:}

# Frontend Origin
app.frontend-url=http://localhost:4200